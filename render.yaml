# Render Blueprint for the CommonTable API (FastAPI backend).
#
# Free tier: the web service sleeps after 15 minutes idle; the database is
# Supabase (free tier), NOT Render Postgres (Render's free Postgres expires
# after 30 days). See README "Deploying (Render + Supabase, free tier)".
#
# Deploy: Render dashboard -> New -> Blueprint -> connect the
# Techie03/commontable repo. Fill in the two sync:false env vars at deploy
# time: DATABASE_URL is the Supabase session-pooler connection string,
# JWT_SECRET_KEY is a long random secret (generate one, never reuse).
#
# The start command runs migrations, the seed, the Denton census import,
# the pilot menu import, and the pilot menu image step before starting
# uvicorn. All five are idempotent, so re-running them on every start
# (including wakes from sleep) is safe; this is deliberate for the free
# tier, where pre-deploy hooks are not relied on.

services:
  - type: web
    name: commontable-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python scripts/seed.py && python scripts/import_denton_restaurants.py && python scripts/import_pilot_menus.py && python scripts/apply_pilot_menu_images.py && exec uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: FRONTEND_URL
        value: https://trycommontable.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
